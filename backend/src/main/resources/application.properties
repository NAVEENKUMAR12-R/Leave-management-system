spring.application.name=leavemanagement
server.port=${PORT:8080}

# Load local credentials from backend/.env when present; environment variables still take precedence.
spring.config.import=optional:file:.env[.properties]

# Supabase PostgreSQL Database Configuration
# Obtain credentials from Supabase Dashboard: Project Settings -> Database -> Connection string
# For cloud deployments, use Supavisor Session Pooler (port 5432, IPv4 compatible):
# DATABASE_URL=jdbc:postgresql://aws-0-<REGION>.pooler.supabase.com:5432/postgres?sslmode=require
# DATABASE_USERNAME=postgres.<PROJECT_REF>
# DATABASE_PASSWORD=<YOUR_PASSWORD>
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# ddl-auto=update: Hibernate will auto-create/update tables on startup (safe for dev)
# Use ddl-auto=validate or ddl-auto=none in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Required for PostgreSQL to avoid LOB creation context warnings
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# Disable SQL formatting in logs (enable for debugging)
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-timeout=60000

# JWT Configuration
leavemanagement.app.jwtSecret=LeaveManagementSystemSecretKeyWhichNeedsToBeLongEnoughForHS512AlgorithmToWorkPerfectlyInSecurity2026
leavemanagement.app.jwtExpirationMs=86400000
